[Service]
# Sending grades to Gradescope (AGENTS.md): the PATH of the saved sign-in, which ~/.config/faculty/save-gradescope.py writes (0600).
# Only the path is in the environment; the worker reads the file when it signs in. Unset, Faculty never contacts Gradescope.
Environment=FACULTY_GRADESCOPE_CREDENTIALS_FILE=%h/.config/faculty/gradescope.json
