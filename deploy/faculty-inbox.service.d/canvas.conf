[Service]
# Canvas (AGENTS.md "Canvas", "Communications record"): the Inbox worker's capture rounds read the instructor's Canvas messages and
# submission comments with the session the sign-in window keeps (0600). The worker also carries out the scheduled morning
# Sync with Canvas and its contracted posting rules; unset, the worker never contacts Canvas.
Environment=FACULTY_CANVAS_SESSION_FILE=%h/.config/faculty/canvas-session.json
