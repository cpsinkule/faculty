[Service]
# Recordings (docs/decisions/recordings.md, RECORDINGS "Plaud"): the COMMAND of the Plaud intake (~/code/plaud-intake), the one
# program that talks to Plaud, holds its sign-in and renews it. The Inbox worker's `recordings-capture` thread runs it (list, show,
# audio, status and, on a round the instructor asked for, check-now) and reads the files it names inside the intake's archive; it
# is never given a token and never runs the intake's own round, copy or renewal. Unset, Faculty says Plaud is not set up and runs
# nothing.
Environment=FACULTY_PLAUD_INTAKE=%h/code/plaud-intake/bin/plaud-intake
