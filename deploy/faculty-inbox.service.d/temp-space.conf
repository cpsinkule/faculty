# Scratch files (scan inspection, LaTeX builds, uploads) go to the NVMe data drive, not the small root disk.
# This folder is runtime scratch beside Faculty's managed storage: never a payload owner and never backed up.
# /tmp is emptied at reboot and this is not, so each service clears only its own leftovers when it starts.
[Service]
Environment=TMPDIR=/mnt/nvme/Teaching/tmp/worker
ExecStartPre=/usr/bin/mkdir -p -m 700 /mnt/nvme/Teaching/tmp/worker
ExecStartPre=/usr/bin/find /mnt/nvme/Teaching/tmp/worker -mindepth 1 -delete
