[Service]
# Recordings (docs/decisions/recordings.md, RECORDINGS "Plaud"): the COMMAND of the Plaud intake (~/code/plaud-intake), the one
# program that talks to Plaud. Faculty asks Plaud nothing: it runs this command (list, show, audio, status and, on a round the
# instructor asked for, check-now) and reads the files it names inside the intake's archive. The web process runs it to say where a
# recording's audio is and to play it from the archive (capture runs in the Inbox worker, which has the same line in
# deploy/faculty-inbox.service.d/plaud.conf). Unset, Faculty says Plaud is not set up and runs nothing.
Environment=FACULTY_PLAUD_INTAKE=%h/code/plaud-intake/bin/plaud-intake
