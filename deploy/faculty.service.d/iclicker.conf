[Service]
# iClicker (AGENTS.md "iClicker"): the PATH of the saved sign-in, which iClicker shares with Gradescope (requirement, 2026-09-28);
# ~/.config/faculty/save-gradescope.py writes it (0600). The web process reads it only when it signs in to iClicker for the
# gradebook's Import from iClicker. Unset, Faculty never contacts iClicker.
Environment=FACULTY_ICLICKER_CREDENTIALS_FILE=%h/.config/faculty/gradescope.json
